<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activities - Trip Planning</title>
  <link rel="stylesheet" href="{{ shared_assets_base }}/theme.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Activities</h1>
    <p class="subtitle">Create activities here, or from within a trip - they're the same form either way.</p>
  </header>

  <div id="app-nav-mount"></div>

  <main>
    <div id="page-message" class="page-message hidden"></div>

    <div id="add-activity-container"></div>

    <details id="categories-section" class="archived-section">
      <summary><span>Manage categories</span></summary>
      <div id="category-rows" class="category-rows"></div>
      <div class="category-save-row">
        <button type="button" id="save-category-changes-btn" class="save-btn">Save changes</button>
      </div>
      <form id="add-category-form" class="category-add-form">
        <input type="text" id="new-category-name" placeholder="Category name" required />
        <input type="color" id="new-category-color" value="#375a99" />
        <select id="new-category-text-color" aria-label="Text color">
          <option value="dark">Dark text</option>
          <option value="light">Light text</option>
        </select>
        <span id="new-category-preview" class="category-preview-row">Preview</span>
        <button type="submit" class="save-btn">Add</button>
      </form>
    </details>

    <div id="distance-tool-mount"></div>

    <section>
      <div class="list-header">
        <h2>All activities</h2>
        <span id="activity-count" class="list-count"></span>
        <div id="city-filter-mount" class="list-header-controls"></div>
        <select id="activity-sort-select" class="sort-select" aria-label="Sort activities">
          <option value="default">Default order</option>
          <option value="category">By category</option>
        </select>
      </div>
      <div id="activities-list" class="item-list"></div>
      <p id="empty-state" class="empty-state" hidden>No activities yet - add one above to get started.</p>
      <p id="city-filtered-empty" class="empty-state" hidden>No activities match the selected cities.</p>

      <details id="done-activities-section" class="archived-section" hidden>
        <summary><span id="done-activities-summary-text">Done</span></summary>
        <div id="done-activities-list" class="item-list"></div>
      </details>

      <details id="archived-activities-section" class="archived-section" hidden>
        <summary><span id="archived-activities-summary-text">Archived</span></summary>
        <div id="archived-activities-list" class="item-list"></div>
      </details>
    </section>
    <div id="app-version"></div>
  </main>


  <script src="{{ shared_assets_base }}/theme.js"></script>
  <script src="{{ shared_assets_base }}/icons.js"></script>
  <script src="version.js"></script>
  <script src="common.js"></script>
  <script src="nav.js"></script>
  <script src="activity-shared.js"></script>
  <script src="activities.js"></script>
</body>
</html>
