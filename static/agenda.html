<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agenda - Trip Planning</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1 id="page-title">Agenda</h1>
    <p class="subtitle">Drag an unscheduled activity into a day to set its time. The "production" view - referred to on the trip, edited from the trip page.</p>
  </header>

  <nav class="app-nav">
    <a href="/" class="app-nav-link">
      <span class="app-nav-icon" data-icon="compass" aria-hidden="true"></span>
      Trips
    </a>
    <a href="/activities.html" class="app-nav-link">
      <span class="app-nav-icon" data-icon="list" aria-hidden="true"></span>
      Activities
    </a>
  </nav>

  <main class="wide">
    <a id="back-link" href="/" class="back-link">← Back to trip</a>
    <div id="page-message" class="page-message hidden"></div>
    <div id="stay-banner" class="stay-banner hidden"></div>

    <div id="agenda-days" class="agenda-days"></div>

    <section class="section">
      <h2>Unscheduled</h2>
      <p class="note">Drag one of these onto a day above, or drag a scheduled one back here to clear its time.</p>
      <div id="unscheduled-list" class="item-list agenda-unscheduled"></div>
      <p id="unscheduled-empty" class="empty-state" hidden>Nothing unscheduled.</p>
    </section>
    <div id="app-version"></div>
  </main>


  <script src="icons.js"></script>
  <script src="version.js"></script>
  <script src="common.js"></script>
  <script src="agenda.js"></script>
</body>
</html>
